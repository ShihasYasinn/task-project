<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Admin Dashboard</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f8f8fb;
            font-family: 'Inter', sans-serif;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .login-card {
            width: 100%;
            max-width: 400px;
            background: #ffffff;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            overflow: hidden;
            border: 1px solid #f1f5f7;
        }
        .login-header {
            background-color: #2a3042;
            padding: 30px;
            text-align: center;
            color: white;
        }
        .login-header h3 {
            margin: 0;
            font-size: 24px;
            font-weight: 600;
        }
        .login-header p {
            margin: 5px 0 0 0;
            color: #a6b0cf;
            font-size: 14px;
        }
        .login-body {
            padding: 30px;
        }
        .form-control {
            padding: 10px 15px;
            font-size: 14px;
            background-color: #f8f9fa;
            border: 1px solid #ced4da;
        }
        .form-control:focus {
            background-color: #ffffff;
            border-color: #626ed4;
            box-shadow: none;
        }
        .btn-primary {
            background-color: #626ed4;
            border-color: #626ed4;
            padding: 10px;
            font-weight: 600;
            width: 100%;
        }
        .btn-primary:hover {
            background-color: #5560b8;
            border-color: #5560b8;
        }
    </style>
</head>
<body>

    <div class="login-card">
        <div class="login-header">
            <h3><i class="fa-solid fa-list-check"></i> TASK</h3>
            <p>Sign in to continue to Dashboard.</p>
        </div>
        <div class="login-body">
            {% if form.errors %}
                <div class="alert alert-danger" style="font-size: 13px;">
                    Your email and password didn't match. Please try again.
                </div>
            {% endif %}

            <form method="post" action="{% url 'login' %}">
                {% csrf_token %}
                <div class="mb-3">
                    <label class="form-label" for="id_username">Email</label>
                    <input type="email" name="username" class="form-control" id="id_username" placeholder="Enter email" required>
                </div>
                <div class="mb-4">
                    <label class="form-label" for="id_password">Password</label>
                    <input type="password" name="password" class="form-control" id="id_password" placeholder="Enter password" required>
                </div>
                <div class="mb-3">
                    <button type="submit" class="btn btn-primary">Log In</button>
                </div>
                <input type="hidden" name="next" value="{{ next|default:'/' }}">
            </form>
        </div>
    </div>

</body>
</html>
