<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Dashboard | Admin{% endblock %}</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- FontAwesome -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        :root {
            --sidebar-bg: #2a3042;
            --sidebar-text: #a6b0cf;
            --sidebar-text-hover: #ffffff;
            --topbar-bg: #ffffff;
            --body-bg: #f8f8fb;
            --primary: #626ed4;
            --text-color: #495057;
            --header-height: 70px;
            --sidebar-width: 250px;
        }
        body {
            background-color: var(--body-bg);
            color: var(--text-color);
            font-family: 'Inter', sans-serif;
            overflow-x: hidden;
        }
        /* Sidebar */
        .sidebar {
            width: var(--sidebar-width);
            background-color: var(--sidebar-bg);
            position: fixed;
            top: 0;
            bottom: 0;
            left: 0;
            z-index: 1001;
            box-shadow: 0 0.75rem 1.5rem rgba(18,38,63,.03);
            transition: all 0.2s;
        }
        .sidebar .logo-box {
            height: var(--header-height);
            display: flex;
            align-items: center;
            padding: 0 24px;
            color: white;
            font-size: 20px;
            font-weight: bold;
            background-color: #262b3c;
        }
        .sidebar .logo-box i {
            color: #ffffff;
            margin-right: 10px;
            font-size: 24px;
        }
        .sidebar-menu {
            padding: 10px 0;
            list-style: none;
            margin: 0;
        }
        .sidebar-menu li.menu-title {
            padding: 12px 24px;
            font-size: 11px;
            text-transform: uppercase;
            color: #6a7187;
            font-weight: 600;
        }
        .sidebar-menu a {
            display: flex;
            align-items: center;
            padding: 12px 24px;
            color: var(--sidebar-text);
            text-decoration: none;
            font-size: 14.5px;
            transition: all 0.3s;
        }
        .sidebar-menu a i {
            width: 20px;
            margin-right: 10px;
            font-size: 16px;
            text-align: center;
        }
        .sidebar-menu a:hover, .sidebar-menu a.active {
            color: var(--sidebar-text-hover);
        }
        .sidebar-menu a.active {
            background-color: rgba(255,255,255,0.05);
            border-left: 3px solid var(--primary);
        }
        .sidebar-menu .badge {
            margin-left: auto;
            border-radius: 10px;
        }
        
        /* Topbar */
        .topbar {
            position: fixed;
            top: 0;
            right: 0;
            left: var(--sidebar-width);
            height: var(--header-height);
            background-color: var(--topbar-bg);
            box-shadow: 0 1px 2px rgba(0,0,0,0.05);
            z-index: 1000;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 24px;
            transition: all 0.2s;
        }
        .topbar-left {
            display: flex;
            align-items: center;
        }
        .topbar-left h4 {
            margin: 0;
            margin-left: 15px;
            font-size: 16px;
            font-weight: 600;
            color: #343a40;
        }
        .btn-menu {
            border: none;
            background: none;
            font-size: 20px;
            color: var(--text-color);
            cursor: pointer;
        }
        .topbar-right {
            display: flex;
            align-items: center;
            gap: 20px;
        }
        .topbar-right i {
            font-size: 18px;
            color: #555b6d;
            cursor: pointer;
        }
        .topbar-right .user-dropdown {
            display: flex;
            align-items: center;
            gap: 10px;
            cursor: pointer;
        }
        .topbar-right .user-dropdown img {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background-color: #e9ecef;
        }
        .notification-bell {
            position: relative;
        }
        .notification-bell .badge {
            position: absolute;
            top: -5px;
            right: -8px;
            font-size: 10px;
            background: #f06292;
        }

        /* Main Content */
        .main-content {
            margin-left: var(--sidebar-width);
            padding-top: var(--header-height);
            min-height: 100vh;
            transition: all 0.2s;
        }
        .page-content {
            padding: 24px;
        }

        /* Responsive */
        @media (max-width: 992px) {
            .sidebar {
                transform: translateX(-100%);
            }
            .topbar, .main-content {
                left: 0;
                margin-left: 0;
            }
        }
    </style>
</head>
<body>

    <!-- Sidebar -->
    <div class="sidebar">
        <div class="logo-box">
            <i class="fa-solid fa-list-check"></i> TASK
        </div>
        <ul class="sidebar-menu">
            <li class="menu-title">Main</li>
            <li>
                <a href="{% url 'dashboard' %}" class="{% if request.resolver_match.url_name == 'dashboard' %}active{% endif %}">
                    <i class="fa-solid fa-desktop"></i> Dashboard
                </a>
            </li>
            <li>
                <a href="{% url 'user-list' %}" class="{% if 'user' in request.resolver_match.url_name %}active{% endif %}">
                    <i class="fa-solid fa-users"></i> Users
                </a>
            </li>
            <li>
                <a href="{% url 'department-list' %}" class="{% if 'department' in request.resolver_match.url_name %}active{% endif %}">
                    <i class="fa-solid fa-building"></i> Departments
                </a>
            </li>
            <li>
                <a href="{% url 'service-list' %}" class="{% if 'service' in request.resolver_match.url_name %}active{% endif %}">
                    <i class="fa-solid fa-concierge-bell"></i> Services
                </a>
            </li>
            <li>
                <a href="{% url 'client-list' %}" class="{% if 'client' in request.resolver_match.url_name %}active{% endif %}">
                    <i class="fa-solid fa-user-tie"></i> Clients
                </a>
            </li>
            <li>
                <a href="{% url 'project-list' %}" class="{% if 'project' in request.resolver_match.url_name %}active{% endif %}">
                    <i class="fa-solid fa-folder-tree"></i> Projects
                </a>
            </li>
        </ul>
    </div>

    <!-- Topbar -->
    <div class="topbar">
        <div class="topbar-left">
            <button class="btn-menu">
                <i class="fa-solid fa-bars"></i>
            </button>
            <h4>Dashboard</h4>
        </div>
        <div class="topbar-right">
            <div class="user-dropdown dropdown">
                <img src="https://ui-avatars.com/api/?name={{ user.name|default:'Admin' }}&background=e9ecef&color=333" alt="User">
                <form action="{% url 'logout' %}" method="post" class="d-inline ms-2">
                    {% csrf_token %}
                    <button type="submit" class="btn btn-sm btn-outline-secondary" style="font-size: 12px; padding: 2px 6px;">Logout</button>
                </form>
            </div>
        </div>
    </div>

    <!-- Main Content -->
    <div class="main-content">
        <div class="page-content">
            {% if messages %}
                {% for message in messages %}
                    <div class="alert alert-{{ message.tags }} alert-dismissible fade show" role="alert">
                        {{ message }}
                        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                    </div>
                {% endfor %}
            {% endif %}
            {% block content %}{% endblock %}
        </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
