{% extends 'dashboard/base.html' %}

{% block title %}Delete Department | Task Admin{% endblock %}

{% block content %}
<div class="row justify-content-center pt-5">
    <div class="col-xl-5 col-lg-6">
        <div class="card border-0 shadow-lg">
            <div class="card-body p-5 text-center">
                <div class="text-danger mb-4">
                    <i class="fa-solid fa-circle-exclamation fa-4x"></i>
                </div>
                <h3 class="fw-bold mb-3">Are you sure?</h3>
                <p class="text-muted mb-4">
                    You are about to delete the department <strong>"{{ object.dept_name }}"</strong> ({{ object.dept_code }}). 
                    This action cannot be undone.
                </p>
                
                <form method="post">
                    {% csrf_token %}
                    <div class="d-flex gap-3 justify-content-center">
                        <a href="{% url 'department-list' %}" class="btn btn-light px-4 py-2 border">Cancel</a>
                        <button type="submit" class="btn btn-danger px-4 py-2 shadow-sm">Delete Department</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
