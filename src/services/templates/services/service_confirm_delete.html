{% extends 'dashboard/base.html' %}

{% block title %}Delete Service | Task Admin{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card border-0 shadow-sm mt-5">
            <div class="card-body p-5 text-center">
                <div class="mb-4">
                    <i class="fa-solid fa-triangle-exclamation text-danger fa-4x opacity-50"></i>
                </div>
                <h4 class="mb-3">Are you sure?</h4>
                <p class="text-muted mb-4">
                    You are about to delete the service <strong class="text-dark">"{{ service.name }}"</strong>. 
                    This action cannot be undone.
                </p>
                <form method="post">
                    {% csrf_token %}
                    <div class="d-flex justify-content-center gap-2">
                        <a href="{% url 'service-list' %}" class="btn btn-light px-4">No, Keep it</a>
                        <button type="submit" class="btn btn-danger px-4">Yes, Delete Service</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
